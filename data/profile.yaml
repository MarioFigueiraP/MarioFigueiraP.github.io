hero:
  name: "Mario Figueira"
  tagline: "Post-doctoral Reseacher, Population Biology Unit — Swiss Ornithological Institute (Vogelwarte)"
  lead: >
    I build reproducible Bayesian models for spatial and spatio-temporal processes using INLA, inlabru, and MCMC 
    to turn scattered observations into insights on how phenomena vary across space and time. For highly specialized 
    and complex models, I custom-code Bayesian solvers using deterministic, stochastic, or hybrid approaches to explore
    posterior distributions. 
  links:
    - label: "Tutorials & Short Notes"
      url: "/Tutorials_Notes/"
      primary: true
    - label: "GitHub"
      url: "https://github.com/MarioFigueiraP"
      primary: false
    - label: "ORCID"
      url: "https://orcid.org/0009-0004-4627-0572"
      primary: false

research:
  heading: "Research"
  intro: >
    My work focuses on computational statistics and Bayesian inference. These two pillars have allowed me to develop 
    novel space-time models, focusing both on the classical analysis of species distribution models and on the 
    spatio-temporal analysis of compositional data—particularly through my collaboration on the European project 
    LAMASUS (Land Use and Management) for land-use analysis.
  topics:
    - title: "INLA & inlabru"
      description: "Fast, approximate Bayesian inference for latent Gaussian models."
    - title: "MCMC"
      description: "Markov Chain Monte Carlo methods, diagnostics, and convergence checks."
    - title: "Spatial & spatio-temporal models"
      description: "SPDE-FEM approaches for building geostatistical, discrete graphical and point process models."
    - title: "Hierarchical modeling"
      description: "Hierarchical structures for irregular and complex real-world data."

